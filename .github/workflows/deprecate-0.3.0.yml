name: Deprecate retracted version
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: |
          echo "before:"
          npm view dsh-cool-theme@0.3.0 deprecated --json || true
          npm view dsh-cool-theme@0.3.0 dist --json | head -n 20 || true
          echo "deprecating..."
          npm deprecate "dsh-cool-theme@0.3.0" "retracted - feature rollback, please use 0.3.1 or 0.2.0" --verbose || true
          echo "after:"
          sleep 2
          npm view dsh-cool-theme@0.3.0 deprecated --json || true
          curl -s https://registry.npmjs.org/dsh-cool-theme/0.3.0 | head -c 500 || true
