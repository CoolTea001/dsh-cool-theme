name: Deprecate retracted version
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: |
          npm deprecate dsh-cool-theme@0.3.0 "retracted - feature rollback, please use 0.3.1 or 0.2.0" --verbose || echo "first attempt failed"
          npm view dsh-cool-theme@0.3.0 deprecated || true
