name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & typecheck
        run: pnpm run check

      - name: Check if version already published
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view dsh-cool-theme version 2>/dev/null || echo "0.0.0")
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "Local package version: $PKG_VERSION"
          echo "Published npm version:  $NPM_VERSION"
          if [ "$PKG_VERSION" = "$NPM_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $PKG_VERSION already published — skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version $PKG_VERSION — will publish."
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: pnpm publish --access public --no-git-checks --provenance
        # OIDC trusted publisher: no NPM_TOKEN needed, token is exchanged via id-token
